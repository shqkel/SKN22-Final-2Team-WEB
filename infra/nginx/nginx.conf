http {
    upstream django {
        server django:8000;
    }

    server {
        listen 80;
        server_name _;

        # 모든 /api/* 요청은 Django를 경유 (인증 게이트웨이)
        # Django가 FastAPI로 Internal Token 프록시
        location /api/ {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # SSE 스트리밍 지원 (챗봇 응답)
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        location /admin/ {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Django — Template (MVT)
        location / {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}

events {}
